services:
  - type: web
    name: ris-external-proxy
    runtime: docker
    # The Dockerfile copies package.json / tsconfig.json / src relative to the
    # proxy directory, so the build context must be ./proxy.
    dockerfilePath: ./Dockerfile
    dockerContext: ./proxy
    healthCheckPath: /health
    envVars:
      - key: RIS_PROXY_KEY
        sync: false
      - key: SAUCENAO_API_KEY
        sync: false
      - key: BING_VISUAL_SEARCH_API_KEY
        sync: false
      - key: PORT
        value: "3000"
